name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether the version is already published
        id: version
        run: |
          name=$(jq -r .name package.json)
          current=$(jq -r .version package.json)

          echo "current=$current" >> "$GITHUB_OUTPUT"

          if npm view "$name@$current" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "$name@$current is already on npm. Nothing to release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$name@$current is not on npm yet."
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.changed == 'true'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - if: steps.version.outputs.changed == 'true'
        run: npm ci

      - if: steps.version.outputs.changed == 'true'
        run: npm run typecheck

      - if: steps.version.outputs.changed == 'true'
        run: npm test

      - if: steps.version.outputs.changed == 'true'
        run: npm run build

      - name: Check the published artifact resolves
        if: steps.version.outputs.changed == 'true'
        run: npm run check:package

      # Authenticates with npm trusted publishing, which needs the id-token permission above
      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        run: npm publish --access public

      - name: Tag and create a GitHub release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.current }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes
